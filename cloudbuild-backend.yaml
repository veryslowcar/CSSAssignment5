steps:
  # Builds the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:latest'
      - './backend'

  # Pushes the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:latest'

  # Deploys the backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'recipe-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:latest'
options:
  logging: CLOUD_LOGGING_ONLY